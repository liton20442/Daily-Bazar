<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f8c">
<title>ডেইলি বাজার | Daily Bazar</title>
<style>
:root{--teal:#087f8c;--deep:#075985;--green:#159957;--orange:#f59e0b;--red:#e5484d;--ink:#193047;--muted:#718096;--line:#dce8ed;--paper:#fff;--bg:#eff8fa}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;color:var(--ink);background:radial-gradient(circle at top left,#d9f3ec 0,transparent 34%),linear-gradient(135deg,#f0f9ff,#f3fbf6 55%,#fff7ed);min-height:100vh;padding:22px 14px 40px}
.app{max-width:900px;margin:auto}.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#087f8c,#0d9488 48%,#2563eb);color:#fff;border-radius:24px;padding:26px 28px;box-shadow:0 14px 34px #0759852b}.hero:after{content:"";position:absolute;width:190px;height:190px;border:28px solid #ffffff18;border-radius:50%;right:-40px;top:-72px}.hero-row{display:flex;justify-content:space-between;align-items:center;gap:14px;position:relative;z-index:1}.brand{display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:#ffffff24;font-size:31px;box-shadow:inset 0 0 0 1px #ffffff30}.hero h1{font-size:clamp(25px,4vw,35px);margin:0 0 6px;letter-spacing:.2px}.hero p{margin:0;color:#e3fbff;font-size:14px}.date-pill{background:#ffffff20;border:1px solid #ffffff4d;border-radius:14px;padding:10px 13px;font-size:13px;white-space:nowrap}
.summary{margin:-16px 18px 22px;position:relative;z-index:2;background:#fff;border:1px solid #e0eef0;border-radius:18px;padding:17px 22px;box-shadow:0 8px 24px #17465b12;display:flex;justify-content:space-between;align-items:center;gap:12px}.sum-label{color:var(--muted);font-size:14px;margin-bottom:5px}.sum-value{font-size:clamp(25px,5vw,34px);font-weight:750;color:#087f8c;letter-spacing:.2px}.sum-value small{font-size:15px;color:#4d7a83;font-weight:600}.count{background:#e7f8f1;color:#117a52;border-radius:12px;padding:9px 12px;font-size:13px;white-space:nowrap}
.panel{background:#ffffffed;border:1px solid #deeaee;border-radius:18px;padding:15px;box-shadow:0 8px 26px #17465b0d}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.panel-head h2{font-size:17px;margin:0}.hint{font-size:12px;color:var(--muted);margin-top:4px}.entry{display:none}.field{width:100%;min-width:0;border:1px solid #cbdde3;background:#fbfeff;border-radius:12px;padding:13px 14px;font-size:16px;color:var(--ink);outline:none;transition:.18s}.field:focus{border-color:#0d9488;box-shadow:0 0 0 3px #0d94881a;background:#fff}.btn{border:0;border-radius:12px;padding:12px 15px;font-size:14px;font-weight:650;cursor:pointer;transition:transform .15s,filter .15s;display:inline-flex;justify-content:center;align-items:center;gap:7px;white-space:nowrap}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.btn:active{transform:translateY(0)}.btn-add{background:linear-gradient(135deg,#0d9488,#087f8c);color:#fff;box-shadow:0 5px 12px #087f8c22}.btn-soft{background:#e9f5f8;color:#176578}.btn-backup{background:#e9f8ef;color:#157347}.btn-restore{background:#fff4dc;color:#985d00}.btn-clear{background:#fff0ef;color:#bf3439}.btn:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:0;background:#fff;table-layout:fixed}thead{background:linear-gradient(90deg,#e8f7f5,#edf6ff)}th{text-align:left;padding:9px 7px;color:#356071;font-size:12px;font-weight:700;border-bottom:1px solid var(--line)}th:nth-child(1),td:nth-child(1){width:38px;text-align:center}th:nth-child(2),td:nth-child(2){width:auto}th:nth-child(3),td:nth-child(3){width:88px;text-align:right}th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){width:42px;text-align:center}td{padding:4px 5px;border-bottom:1px solid #edf2f5;vertical-align:middle}tbody tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#fbfdfe}.desc-input,.amount-input{width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 5px;font:inherit;font-size:14px;outline:none;min-width:0}.desc-input:focus,.amount-input:focus{border-color:#a9dcd7;background:#fff;box-shadow:0 0 0 2px #0d948814}.amount-input{text-align:right;font-variant-numeric:tabular-nums}.amount-input::placeholder,.desc-input::placeholder{color:#a0afb8}.check-btn,.delete-btn{width:34px;height:34px;border:0;border-radius:10px;cursor:pointer;font-size:18px;display:inline-grid;place-items:center;transition:.15s}.check-btn{background:#fff;color:#168451;border:1px solid #d5e3e7}.check-btn[aria-pressed="true"]{background:#fff;color:#168451;border-color:#168451;font-weight:800}.delete-btn{background:#fff0ef;color:#d33d42}.check-btn:hover,.delete-btn:hover{transform:scale(1.06)}.empty{padding:28px 12px;text-align:center;color:#8497a1;font-size:14px}.empty span{display:block;font-size:28px;margin-bottom:8px}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px;flex-wrap:wrap}.footer-note{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#18394a;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px #0002;transition:.22s;z-index:10;max-width:calc(100vw - 28px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}input[type=file]{display:none}
@media(max-width:620px){body{padding:12px 9px 28px}.hero{padding:20px 17px;border-radius:19px}.logo{width:48px;height:48px;font-size:26px;border-radius:15px}.brand{gap:10px}.hero p{font-size:12px}.date-pill{display:none}.summary{margin:-12px 10px 16px;padding:14px 16px}.panel{padding:11px 8px;border-radius:15px}.panel-head h2{font-size:16px}.entry{grid-template-columns:minmax(0,1fr) 112px;gap:8px}.entry .btn{grid-column:1/-1}.field{padding:12px 10px;font-size:16px}.footer{align-items:flex-start}.actions{width:100%}.actions .btn{flex:1;padding:11px 9px;font-size:13px}.footer-note{width:100%}th{padding:8px 5px;font-size:11px}td{padding:3px 3px}th:nth-child(1),td:nth-child(1){width:30px}th:nth-child(3),td:nth-child(3){width:76px}th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){width:35px}.desc-input,.amount-input{font-size:13px;padding:7px 3px}.check-btn,.delete-btn{width:27px;height:27px;border-radius:7px;font-size:16px}.sum-label{font-size:12px}.count{font-size:12px;padding:8px 9px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="hero-row"><div class="brand"><div class="logo" aria-hidden="true">🛒</div><div><h1>ডেইলি বাজার</h1><p>Daily Bazar · আপনার প্রতিদিনের বাজারের হিসাব</p></div></div><div class="date-pill" id="todayDate"></div></div></header>
<section class="summary" aria-live="polite"><div><div class="sum-label">সর্বমোট বাজার খরচ</div><div class="sum-value"><span id="totalAmount">0</span> <small>টাকা</small></div></div><div class="count"><span id="itemCount">0</span>টি আইটেম</div></section>
<main class="panel"><div class="panel-head"><div><h2>🧺 বাজারের তালিকা</h2><div class="hint">সরাসরি টেবিলে লিখুন · Enter চাপলে পরের সারি</div></div><button class="btn btn-soft" id="addRowTop" type="button">＋ সারি</button></div>
<div class="table-wrap"><table><thead><tr><th>নং</th><th>বিবরণ</th><th>টাকা (৳)</th><th>✓</th><th>✕</th></tr></thead><tbody id="itemsBody"></tbody></table><div id="emptyState" class="empty"><span>🧾</span>টেবিলে সরাসরি বাজারের জিনিস ও টাকার পরিমাণ লিখুন।</div></div>
<div class="footer"><div class="footer-note">🔒 এই ব্রাউজারেই স্বয়ংক্রিয়ভাবে সেভ হবে</div><div class="actions"><button class="btn btn-backup" id="backupBtn" type="button">⬇ Backup</button><button class="btn btn-restore" id="restoreBtn" type="button">↥ Restore</button><button class="btn btn-clear" id="clearBtn" type="button">✕ Clear</button><input id="restoreFile" type="file" accept=".json,application/json"></div></div>
</main></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const STORAGE_KEY='dailyBazarItems_v1';
const body=document.getElementById('itemsBody'), empty=document.getElementById('emptyState'), desc=document.getElementById('newDescription'), amount=document.getElementById('newAmount'), totalEl=document.getElementById('totalAmount'), countEl=document.getElementById('itemCount'), toastEl=document.getElementById('toast'), restoreFile=document.getElementById('restoreFile');
let items=[], toastTimer;
const moneyFmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
function parseAmount(value){let s=String(value??'').trim().replace(/[৳,\s]/g,'').replace(/[^\d.\-]/g,'');if(!s||s==='.'||s==='-'||s==='-.')return 0;const n=Number(s);return Number.isFinite(n)?n:0}
function displayMoney(n){return moneyFmt.format(Math.round((n+Number.EPSILON)*100)/100)}
function notify(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200)}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(items))}catch(e){notify('অটো-সেভ করা যায়নি। Backup নিন।')}}
function load(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(data))items=data.filter(x=>x&&typeof x==='object').map(x=>({id:String(x.id||makeId()),description:String(x.description||''),amount:String(x.amount??''),checked:!!x.checked}));}catch(e){items=[]}}
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function isBlank(item){return !item.description.trim()&&!String(item.amount).trim()}
function updateSummary(){const total=items.reduce((sum,item)=>sum+parseAmount(item.amount),0);totalEl.textContent=displayMoney(total);countEl.textContent=items.filter(x=>!isBlank(x)).length;empty.style.display=items.some(x=>!isBlank(x))?'none':'block'}
function render(focusId=null,focusField='description'){body.textContent='';items.forEach((item,index)=>{const tr=document.createElement('tr');if(item.checked)tr.classList.add('checked');tr.dataset.id=item.id;
const serial=document.createElement('td');serial.textContent=index+1;tr.appendChild(serial);
const dtd=document.createElement('td'),di=document.createElement('input');di.type='text';di.className='desc-input';di.value=item.description;di.placeholder='আইটেমের নাম';di.setAttribute('aria-label',`সারি ${index+1}, বিবরণ`);di.dataset.field='description';di.addEventListener('input',()=>{item.description=di.value;save()});di.addEventListener('keydown',onRowEnter);dtd.appendChild(di);tr.appendChild(dtd);
const atd=document.createElement('td'),ai=document.createElement('input');ai.type='text';ai.inputMode='text';ai.className='amount-input';ai.value=item.amount;ai.placeholder='0';ai.setAttribute('aria-label',`সারি ${index+1}, টাকার পরিমাণ`);ai.dataset.field='amount';ai.addEventListener('input',()=>{item.amount=ai.value;save();updateSummary()});ai.addEventListener('keydown',onRowEnter);ai.addEventListener('blur',()=>{const v=ai.value.trim();if(v){const n=parseAmount(v);if(Number.isFinite(n)){item.amount=String(Math.round(n*100)/100);ai.value=item.amount;save();updateSummary()}}});atd.appendChild(ai);tr.appendChild(atd);
const ctd=document.createElement('td'),cb=document.createElement('button');cb.type='button';cb.className='check-btn';cb.textContent=item.checked?'✓':'';cb.title=item.checked?'অসম্পূর্ণ হিসেবে চিহ্নিত করুন':'সম্পন্ন হিসেবে চিহ্নিত করুন';cb.setAttribute('aria-label',cb.title);cb.setAttribute('aria-pressed',String(item.checked));cb.addEventListener('click',()=>{item.checked=!item.checked;save();render()});ctd.appendChild(cb);tr.appendChild(ctd);
const xtd=document.createElement('td'),xb=document.createElement('button');xb.type='button';xb.className='delete-btn';xb.textContent='×';xb.title='আইটেম মুছুন';xb.setAttribute('aria-label',`সারি ${index+1} মুছুন`);xb.addEventListener('click',()=>{items=items.filter(x=>x.id!==item.id);save();render();notify('আইটেম মুছে ফেলা হয়েছে')});xtd.appendChild(xb);tr.appendChild(xtd);body.appendChild(tr);
});updateSummary();if(focusId){const row=[...body.querySelectorAll('tr')].find(r=>r.dataset.id===focusId);const field=row?.querySelector(`[data-field="${focusField}"]`);if(field){field.focus();field.select?.()}}}
function onRowEnter(e){if(e.key!=='Enter')return;e.preventDefault();const row=e.currentTarget.closest('tr'),id=row.dataset.id;const idx=items.findIndex(x=>x.id===id);if(idx<0)return;if(e.currentTarget.dataset.field==='description'){row.querySelector('[data-field="amount"]').focus();return}const created={id:makeId(),description:'',amount:'',checked:false};items.splice(idx+1,0,created);save();render(created.id,'description')}
function addItem(){const description=desc.value.trim(),value=amount.value.trim();if(!description&&!value){desc.focus();return}const item={id:makeId(),description,amount:value?String(Math.round(parseAmount(value)*100)/100):'',checked:false};items.push(item);desc.value='';amount.value='';save();render(item.id,'description')}
document.getElementById('addRowTop').addEventListener('click',()=>{const item={id:makeId(),description:'',amount:'',checked:false};items.push(item);save();render(item.id,'description')});
document.getElementById('backupBtn').addEventListener('click',()=>{const payload={app:'Daily Bazar',version:1,exportedAt:new Date().toISOString(),items};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Daily_Bazar_Backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup ফাইল তৈরি হয়েছে')});
document.getElementById('restoreBtn').addEventListener('click',()=>restoreFile.click());restoreFile.addEventListener('change',async()=>{const file=restoreFile.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());const incoming=Array.isArray(parsed)?parsed:parsed.items;if(!Array.isArray(incoming))throw new Error('invalid');if(!confirm('বর্তমান তালিকার বদলে Backup ফাইলের তালিকা Restore করবেন?'))return;items=incoming.filter(x=>x&&typeof x==='object').map(x=>({id:String(x.id||makeId()),description:String(x.description||''),amount:String(x.amount??''),checked:!!x.checked}));save();render();notify('Backup সফলভাবে Restore হয়েছে')}catch(e){alert('এই Backup ফাইলটি সঠিক নয়। সঠিক Daily Bazar JSON ফাইল নির্বাচন করুন।')}finally{restoreFile.value=''}});
document.getElementById('clearBtn').addEventListener('click',()=>{if(!items.length){notify('তালিকা ইতিমধ্যে খালি');return}if(confirm('সব বাজারের আইটেম ও হিসাব মুছে ফেলবেন? আগে প্রয়োজন হলে Backup নিন।')){items=[{id:makeId(),description:'',amount:'',checked:false}];save();render(items[0].id,'description');notify('তালিকা পরিষ্কার করা হয়েছে')}});
const now=new Date();document.getElementById('todayDate').textContent=now.toLocaleDateString('bn-BD',{day:'numeric',month:'short',year:'numeric'});load();if(!items.length)items.push({id:makeId(),description:'',amount:'',checked:false});render();
})();
</script>
</body></html>
